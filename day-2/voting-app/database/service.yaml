# Headless Service (clusterIP: None) for the StatefulSet.
# Gives each pod a stable DNS name: voting-db-0.voting-db
# The API connects to it with: voting-db:5432
apiVersion: v1
kind: Service
metadata:
  name: voting-db
  labels:
    app: voting-db
spec:
  clusterIP: None
  selector:
    app: voting-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
