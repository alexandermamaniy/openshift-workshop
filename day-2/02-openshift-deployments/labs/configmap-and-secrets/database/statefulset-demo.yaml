apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-db
spec:
  serviceName: demo-db
  replicas: 1
  selector:
    matchLabels:
      app: demo-db
  template:
    metadata:
      labels:
        app: demo-db
    spec:
      containers:
      - name: db
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        # Sensitive values, loaded from Secret
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: demo-db-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: demo-db-secret
              key: POSTGRES_PASSWORD
        # Non-sensitive config, loaded from ConfigMap
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: demo-db-config
              key: POSTGRES_DB
        - name: PGDATA
          valueFrom:
            configMapKeyRef:
              name: demo-db-config
              key: PGDATA
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: gp3-csi
      resources:
        requests:
          storage: 4Gi
