# Database credentials.
#
# The password is NOT stored in this file (no secrets in git). It is a
# placeholder that envsubst fills in when you apply it:
#
#   POSTGRES_PASSWORD="$(openssl rand -base64 18)" envsubst < secret.yaml | oc apply -f -
#
# Do not run "oc apply -f secret.yaml" directly: it would store the literal
# text ${POSTGRES_PASSWORD} as the password.
apiVersion: v1
kind: Secret
metadata:
  name: voting-db-secret
  labels:
    app: voting-db
type: Opaque
stringData:
  POSTGRES_USER: voting
  POSTGRES_PASSWORD: "password"
