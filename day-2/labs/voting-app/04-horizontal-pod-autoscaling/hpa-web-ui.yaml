apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voting-web-ui-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voting-web-ui
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        # nginx serving static files rarely spikes CPU. This HPA scales on
        # connection volume rather than compute pressure. Set a low threshold
        # so students can observe scaling during the lab even under moderate load.
        averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 2
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 1
        periodSeconds: 30
