# Coffee Shop Deployment (Node.js + Express).
#
# The image is built inside the cluster (see README) and pushed to the internal
# registry as the "coffee-shop-app" ImageStream. "oc set image-lookup" lets us refer
# to it by name, so this file does not depend on the project name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-shop-app
  labels:
    app: coffee-shop-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coffee-shop-app
  template:
    metadata:
      labels:
        app: coffee-shop-app
    spec:
      containers:
      - name: web
        image: coffee-shop-app:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
