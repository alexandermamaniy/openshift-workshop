<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBMeetingU - Profile Setup</title>
    <link rel="stylesheet" href="onboarding.css">
</head>
<body>
    <div class="onboarding-container">
        <div class="onboarding-card">
            <h1 class="title">Welcome to IBMeetingU! 🎉</h1>
            <p class="subtitle">Make meaningful friendships and activity-based connections after work</p>
            
            <form id="onboardingForm" class="onboarding-form">
                <!-- Basic Information -->
                <div class="form-section">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="jobTitle">Job Title</label>
                        <input type="text" id="jobTitle" name="jobTitle" placeholder="e.g., Software Engineer" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" name="department" placeholder="e.g., Engineering">
                    </div>
                    
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" name="location" placeholder="e.g., Dublin, Ireland" required>
                    </div>
                </div>

                <!-- Professional Skills -->
                <div class="form-section">
                    <h3>💻 Technical Skills</h3>
                    <div class="form-group">
                        <label>Programming Languages</label>
                        <div class="tag-group" id="programmingLanguages">
                            <button type="button" class="tag-btn" data-value="JavaScript">JavaScript</button>
                            <button type="button" class="tag-btn" data-value="Python">Python</button>
                            <button type="button" class="tag-btn" data-value="Java">Java</button>
                            <button type="button" class="tag-btn" data-value="TypeScript">TypeScript</button>
                            <button type="button" class="tag-btn" data-value="C#">C#</button>
                            <button type="button" class="tag-btn" data-value="Go">Go</button>
                            <button type="button" class="tag-btn" data-value="Rust">Rust</button>
                            <button type="button" class="tag-btn" data-value="Swift">Swift</button>
                            <button type="button" class="tag-btn" data-value="Kotlin">Kotlin</button>
                            <button type="button" class="tag-btn" data-value="PHP">PHP</button>
                            <button type="button" class="tag-btn" data-value="Ruby">Ruby</button>
                            <button type="button" class="tag-btn" data-value="C++">C++</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Frameworks & Technologies</label>
                        <div class="tag-group" id="frameworks">
                            <button type="button" class="tag-btn" data-value="React">React</button>
                            <button type="button" class="tag-btn" data-value="Angular">Angular</button>
                            <button type="button" class="tag-btn" data-value="Vue.js">Vue.js</button>
                            <button type="button" class="tag-btn" data-value="Node.js">Node.js</button>
                            <button type="button" class="tag-btn" data-value="Django">Django</button>
                            <button type="button" class="tag-btn" data-value="Spring Boot">Spring Boot</button>
                            <button type="button" class="tag-btn" data-value=".NET">.NET</button>
                            <button type="button" class="tag-btn" data-value="Flask">Flask</button>
                            <button type="button" class="tag-btn" data-value="Express">Express</button>
                            <button type="button" class="tag-btn" data-value="FastAPI">FastAPI</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Cloud & DevOps</label>
                        <div class="tag-group" id="cloudDevOps">
                            <button type="button" class="tag-btn" data-value="AWS">AWS</button>
                            <button type="button" class="tag-btn" data-value="Azure">Azure</button>
                            <button type="button" class="tag-btn" data-value="GCP">GCP</button>
                            <button type="button" class="tag-btn" data-value="Docker">Docker</button>
                            <button type="button" class="tag-btn" data-value="Kubernetes">Kubernetes</button>
                            <button type="button" class="tag-btn" data-value="CI/CD">CI/CD</button>
                            <button type="button" class="tag-btn" data-value="Terraform">Terraform</button>
                            <button type="button" class="tag-btn" data-value="Jenkins">Jenkins</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Databases</label>
                        <div class="tag-group" id="databases">
                            <button type="button" class="tag-btn" data-value="PostgreSQL">PostgreSQL</button>
                            <button type="button" class="tag-btn" data-value="MySQL">MySQL</button>
                            <button type="button" class="tag-btn" data-value="MongoDB">MongoDB</button>
                            <button type="button" class="tag-btn" data-value="Redis">Redis</button>
                            <button type="button" class="tag-btn" data-value="Elasticsearch">Elasticsearch</button>
                            <button type="button" class="tag-btn" data-value="DynamoDB">DynamoDB</button>
                        </div>
                    </div>
                </div>

                <!-- Select Your Interests -->
                <div class="form-section">
                    <h3>🎯 Professional & Social Interests</h3>
                    
                    <div class="form-group">
                        <label>🏃 Sports & Fitness</label>
                        <div class="tag-group" id="sportsInterests">
                            <button type="button" class="tag-btn" data-value="Running">Running</button>
                            <button type="button" class="tag-btn" data-value="Yoga">Yoga</button>
                            <button type="button" class="tag-btn" data-value="Gym">Gym</button>
                            <button type="button" class="tag-btn" data-value="Cycling">Cycling</button>
                            <button type="button" class="tag-btn" data-value="Swimming">Swimming</button>
                            <button type="button" class="tag-btn" data-value="Golf">Golf</button>
                            <button type="button" class="tag-btn" data-value="Tennis">Tennis</button>
                            <button type="button" class="tag-btn" data-value="Basketball">Basketball</button>
                            <button type="button" class="tag-btn" data-value="Soccer">Soccer</button>
                            <button type="button" class="tag-btn" data-value="Hiking">Hiking</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>🍽️ Food & Dining</label>
                        <div class="tag-group" id="foodInterests">
                            <button type="button" class="tag-btn" data-value="Coffee Chat">Coffee Chat</button>
                            <button type="button" class="tag-btn" data-value="Lunch Meetup">Lunch Meetup</button>
                            <button type="button" class="tag-btn" data-value="Cooking Class">Cooking Class</button>
                            <button type="button" class="tag-btn" data-value="Food Tour">Food Tour</button>
                            <button type="button" class="tag-btn" data-value="Wine Tasting">Wine Tasting</button>
                            <button type="button" class="tag-btn" data-value="Brunch">Brunch</button>
                            <button type="button" class="tag-btn" data-value="Dinner Clubs">Dinner Clubs</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>🎨 Arts & Culture</label>
                        <div class="tag-group" id="artsInterests">
                            <button type="button" class="tag-btn" data-value="Museum Visit">Museum Visit</button>
                            <button type="button" class="tag-btn" data-value="Art Gallery">Art Gallery</button>
                            <button type="button" class="tag-btn" data-value="Theater">Theater</button>
                            <button type="button" class="tag-btn" data-value="Concert">Concert</button>
                            <button type="button" class="tag-btn" data-value="Photography Walk">Photography Walk</button>
                            <button type="button" class="tag-btn" data-value="Live Music">Live Music</button>
                            <button type="button" class="tag-btn" data-value="Comedy Shows">Comedy Shows</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>🌳 Outdoor Activities</label>
                        <div class="tag-group" id="outdoorInterests">
                            <button type="button" class="tag-btn" data-value="Hiking">Hiking</button>
                            <button type="button" class="tag-btn" data-value="Picnic">Picnic</button>
                            <button type="button" class="tag-btn" data-value="Beach Day">Beach Day</button>
                            <button type="button" class="tag-btn" data-value="Park Walk">Park Walk</button>
                            <button type="button" class="tag-btn" data-value="Camping">Camping</button>
                            <button type="button" class="tag-btn" data-value="Kayaking">Kayaking</button>
                            <button type="button" class="tag-btn" data-value="Rock Climbing">Rock Climbing</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>🎮 Games & Entertainment</label>
                        <div class="tag-group" id="gamesInterests">
                            <button type="button" class="tag-btn" data-value="Board Games">Board Games</button>
                            <button type="button" class="tag-btn" data-value="Video Games">Video Games</button>
                            <button type="button" class="tag-btn" data-value="Bowling">Bowling</button>
                            <button type="button" class="tag-btn" data-value="Mini Golf">Mini Golf</button>
                            <button type="button" class="tag-btn" data-value="Escape Room">Escape Room</button>
                            <button type="button" class="tag-btn" data-value="Trivia Night">Trivia Night</button>
                            <button type="button" class="tag-btn" data-value="Karaoke">Karaoke</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>📚 Learning & Development</label>
                        <div class="tag-group" id="learningInterests">
                            <button type="button" class="tag-btn" data-value="Book Club">Book Club</button>
                            <button type="button" class="tag-btn" data-value="Language Exchange">Language Exchange</button>
                            <button type="button" class="tag-btn" data-value="Workshop">Workshop</button>
                            <button type="button" class="tag-btn" data-value="Skill Share">Skill Share</button>
                            <button type="button" class="tag-btn" data-value="Podcast Club">Podcast Club</button>
                            <button type="button" class="tag-btn" data-value="Study Group">Study Group</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>💼 Professional & Networking</label>
                        <div class="tag-group" id="professionalInterests">
                            <button type="button" class="tag-btn" data-value="Startups">Startups</button>
                            <button type="button" class="tag-btn" data-value="Investing">Investing</button>
                            <button type="button" class="tag-btn" data-value="Entrepreneurship">Entrepreneurship</button>
                            <button type="button" class="tag-btn" data-value="Happy Hour">Happy Hour</button>
                            <button type="button" class="tag-btn" data-value="Networking Event">Networking Event</button>
                            <button type="button" class="tag-btn" data-value="Team Outing">Team Outing</button>
                            <button type="button" class="tag-btn" data-value="Volunteer Work">Volunteer Work</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>✈️ Travel & Adventure</label>
                        <div class="tag-group" id="travelInterests">
                            <button type="button" class="tag-btn" data-value="Travel">Travel</button>
                            <button type="button" class="tag-btn" data-value="Road Trips">Road Trips</button>
                            <button type="button" class="tag-btn" data-value="Weekend Getaways">Weekend Getaways</button>
                            <button type="button" class="tag-btn" data-value="City Exploration">City Exploration</button>
                            <button type="button" class="tag-btn" data-value="Adventure Sports">Adventure Sports</button>
                        </div>
                    </div>
                </div>

                <!-- Availability -->
                <div class="form-section">
                    <h3>⏰ When are you usually free?</h3>
                    
                    <div class="form-group">
                        <label for="availability">Preferred Availability</label>
                        <select id="availability" name="availability">
                            <option value="">Select availability</option>
                            <option value="Weekday Mornings">Weekday Mornings</option>
                            <option value="Weekday Afternoons">Weekday Afternoons</option>
                            <option value="Weekday Evenings">Weekday Evenings</option>
                            <option value="Lunch Hours">Lunch Hours</option>
                            <option value="Weekends">Weekends</option>
                            <option value="Flexible">Flexible</option>
                        </select>
                    </div>
                </div>

                <!-- Bio -->
                <div class="form-section">
                    <h3>📝 Bio (Optional)</h3>
                    <div class="form-group">
                        <label for="bio">Tell us a bit about yourself...</label>
                        <textarea id="bio" name="bio" rows="4" placeholder="Share your interests, hobbies, or what you're passionate about..."></textarea>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Get Started 🚀</button>
            </form>
        </div>
    </div>

    <script src="onboarding.js"></script>
</body>
</html>
