<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBMeetingU - Matches</title>
    <link rel="stylesheet" href="matches.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <button class="back-btn" onclick="window.location.href='index.html'">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#2196F3" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </button>
            <h1 class="logo">Matches</h1>
            <div class="header-spacer"></div>
        </header>

        <!-- Matches List -->
        <div class="matches-container">
            <div class="matches-header">
                <h2>Your Connections 🎉</h2>
                <p id="matchCount">0 matches</p>
            </div>

            <div class="matches-list" id="matchesList">
                <!-- Matches will be dynamically loaded -->
            </div>

            <div class="empty-matches" id="emptyMatches" style="display: none;">
                <div class="empty-icon">💬</div>
                <h3>No matches yet</h3>
                <p>Start swiping to find colleagues to connect with!</p>
                <button class="start-swiping-btn" onclick="window.location.href='index.html'">
                    Start Swiping
                </button>
            </div>
        </div>

        <!-- Chat Modal -->
        <div class="chat-modal" id="chatModal" style="display: none;">
            <div class="chat-container">
                <div class="chat-header">
                    <button class="chat-back-btn" id="closeChatBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="white" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                        </svg>
                    </button>
                    <div class="chat-profile">
                        <img id="chatProfileImage" src="" alt="" class="chat-avatar">
                        <div class="chat-profile-info">
                            <h3 id="chatProfileName"></h3>
                            <p id="chatProfileTitle"></p>
                        </div>
                    </div>
                    <button class="chat-menu-btn">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="white" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                        </svg>
                    </button>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be loaded here -->
                </div>

                <div class="chat-input-container">
                    <button class="chat-action-btn" title="Schedule Meeting">
                        📅
                    </button>
                    <input type="text" id="chatInput" placeholder="Type a message..." class="chat-input">
                    <button class="chat-send-btn" id="sendMessageBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="white" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="matches.js"></script>
</body>
</html>
