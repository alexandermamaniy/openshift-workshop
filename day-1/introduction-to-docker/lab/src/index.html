<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBMeetingU - Connect & Meet</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <button class="header-icon" id="filterBtn" title="Filters">
                <svg viewBox="0 0 24 24" width="28" height="28">
                    <path fill="#2196F3" d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
                </svg>
            </button>
            <h1 class="logo">IBMeetingU</h1>
            <button class="header-icon" id="matchesBtn" title="Matches">
                <svg viewBox="0 0 24 24" width="28" height="28">
                    <path fill="#2196F3" d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                </svg>
            </button>
        </header>

        <!-- Card Stack Container -->
        <div class="card-container">
            <div class="card-stack" id="cardStack">
                <!-- Cards will be dynamically generated -->
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="actions">
            <button class="action-btn rewind-btn" id="rewindBtn">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#64B5F6" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
                </svg>
            </button>
            <button class="action-btn nope-btn" id="nopeBtn">
                <svg viewBox="0 0 24 24" width="32" height="32">
                    <path fill="#1565C0" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
            <button class="action-btn star-btn" id="starBtn">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#42A5F5" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
            </button>
            <button class="action-btn like-btn" id="likeBtn">
                <svg viewBox="0 0 24 24" width="32" height="32">
                    <path fill="#2196F3" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </button>
            <button class="action-btn boost-btn" id="boostBtn">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#1976D2" d="M13 2.05v3.03c3.39.49 6 3.39 6 6.92 0 .9-.18 1.75-.48 2.54l2.6 1.53c.56-1.24.88-2.62.88-4.07 0-5.18-3.95-9.45-9-9.95zM12 19c-3.87 0-7-3.13-7-7 0-3.53 2.61-6.43 6-6.92V2.05c-5.06.5-9 4.76-9 9.95 0 5.52 4.47 10 9.99 10 3.31 0 6.24-1.61 8.06-4.09l-2.6-1.53C16.17 17.98 14.21 19 12 19z"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
